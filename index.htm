<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMR Dashboard - UruguayNet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="inline-block w-3 h-3 rounded-full bg-amber-500 animate-pulse" id="status-dot"></span>
                <h1 class="text-xl font-bold tracking-wide">DMR Dashboard UruguayNet</h1>
            </div>
            <div class="text-sm text-slate-400" id="status-text">Conectando...</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Tarjeta de Llamada Activa -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg md:col-span-1 flex flex-col justify-between">
            <div>
                <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Llamada Activa</h2>
                <div id="active-call" class="space-y-3">
                    <p class="text-slate-400 text-sm italic">Esperando tráfico en el sistema...</p>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-700/60 text-xs text-slate-500 flex justify-between">
                <span>Modo: VPS WSS</span>
                <span id="active-ts">-</span>
            </div>
        </section>

        <!-- Tabla de Últimas Escuchas (Last Heard) -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg md:col-span-2 flex flex-col">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-4">Últimas Transmisiones (Last Heard)</h2>
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="pb-3 font-medium">Hora</th>
                            <th class="pb-3 font-medium">Indicativo</th>
                            <th class="pb-3 font-medium">Nombre / ID</th>
                            <th class="pb-3 font-medium">Talkgroup (TG)</th>
                            <th class="pb-3 font-medium">Slot</th>
                        </tr>
                    </thead>
                    <tbody id="last-heard-body" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="py-4 text-center text-slate-500 italic">Sin registros recientes.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500">
        HBLink3 Dashboard &bull; Conectado a HBLink VPS
    </footer>

    <!-- Script de Conexión WebSocket Seguro y Actualización de UI -->
    <script>
        const wsUrl = 'wss://7481uruguaynet.2mydns.net/ws';
        
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const lastHeardBody = document.getElementById('last-heard-body');
        const activeCallDiv = document.getElementById('active-call');

        let ws;
        let lastHeardData = [];

        function initWebSocket() {
            console.log("Iniciando conexión WebSocket a:", wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("WebSocket OPEN exitoso.");
                statusDot.classList.remove('bg-amber-500', 'bg-red-500');
                statusDot.classList.add('bg-emerald-500', 'animate-none');
                statusText.textContent = 'Conectado (WSS)';
            };

            ws.onmessage = (event) => {
                console.log("Mensaje recibido del VPS:", event.data);
                try {
                    const data = JSON.parse(event.data);
                    updateDashboard(data);
                } catch (e) {
                    console.error('El mensaje no es un JSON válido:', event.data);
                }
            };

            ws.onclose = (event) => {
                console.warn(`WebSocket cerrado (Código: ${event.code}, Razón: ${event.reason})`);
                statusDot.classList.remove('bg-emerald-500');
                statusDot.classList.add('bg-amber-500', 'animate-pulse');
                statusText.textContent = 'Reconectando...';
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('Error en WebSocket:', error);
                statusDot.classList.remove('bg-emerald-500', 'bg-amber-500');
                statusDot.classList.add('bg-red-500');
                statusText.textContent = 'Error de conexión';
            };
        }

        function updateDashboard(data) {
            if (!data) return;

            if (data.CALLSIGN) {
                activeCallDiv.innerHTML = `
                    <div class="text-lg font-bold text-emerald-400">${data.CALLSIGN}</div>
                    <div class="text-sm text-slate-300">TalkGroup: <span class="font-semibold text-white">${data.TG || 'N/A'}</span></div>
                    <div class="text-xs text-slate-400">Slot: ${data.TS || '1'}</div>
                `;
            }

            if (data.TABLE_UPDATE || data.CALLSIGN) {
                const now = new Date().toLocaleTimeString();
                lastHeardData.unshift({
                    time: now,
                    callsign: data.CALLSIGN || 'N/A',
                    name: data.NAME || '-',
                    tg: data.TG || '-',
                    ts: data.TS || '-'
                });

                if (lastHeardData.length > 10) lastHeardData.pop();

                renderTable();
            }
        }

        function renderTable() {
            if (lastHeardData.length === 0) return;
            lastHeardBody.innerHTML = lastHeardData.map(row => `
                <tr class="hover:bg-slate-700/30 transition-colors">
                    <td class="py-3 text-slate-400">${row.time}</td>
                    <td class="py-3 font-semibold text-emerald-400">${row.callsign}</td>
                    <td class="py-3 text-slate-300">${row.name}</td>
                    <td class="py-3 text-white">${row.tg}</td>
                    <td class="py-3 text-slate-300">${row.ts}</td>
                </tr>
            `).join('');
        }

        initWebSocket();
    </script>
</body>
</html>
