<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard DMR / NXDN En Vivo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
            transition: background 0.2s ease;
        }

        .badge-mode {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-tg {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-family: monospace;
        }

        .callsign {
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .time {
            color: var(--text-muted);
            font-family: monospace;
        }

        @media (max-width: 768px) {
            th, td { padding: 10px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Tráfico DMR / NXDN en Tiempo Real</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Modo</th>
                        <th>Estación (Callsign - ID)</th>
                        <th>País</th>
                        <th>Destino</th>
                    </tr>
                </thead>
                <tbody id="traffic-body">
                    <!-- Las transmisiones entran dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Conexión al WebSocket de tu VPS (Asegúrate de usar wss:// si usas HTTPS o ws:// si es directo con IP)
        const ws = new WebSocket('ws://TU_IP_O_DOMINIO:9200');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const tbody = document.getElementById('traffic-body');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="time">${data.time}</td>
                <td><span class="badge-mode">${data.mode}</span></td>
                <td class="callsign">${data.callsign}</td>
                <td>${data.country}</td>
                <td><span class="badge-tg">${data.destination}</span></td>
            `;

            // Inserta la nueva transmisión al principio de la tabla
            tbody.insertBefore(tr, tbody.firstChild);

            // Mantiene un límite de 30 filas para evitar saturar la pantalla
            if (tbody.rows.length > 30) {
                tbody.deleteRow(tbody.rows.length - 1);
            }
        };
    </script>
</body>
</html>
