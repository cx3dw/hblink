<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMR Dashboard Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
        <h1 class="text-xl font-bold mb-4">Prueba de Conexión DMR</h1>
        <div id="log" class="bg-slate-950 p-4 rounded text-xs font-mono text-emerald-400 h-40 overflow-y-auto">
            Iniciando script...<br>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('log');
        function addLog(msg) {
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        addLog("Página cargada correctamente.");
        
        // Intentar conexión de prueba con el VPS
        const targetUrl = 'wss://7481uruguaynet.2mydns.net/ws';
        addLog(`Intentando conectar a: ${targetUrl}`);

        try {
            const ws = new WebSocket(targetUrl);

            ws.onopen = () => {
                addLog("¡CONEXIÓN ESTABLECIDA CON ÉXITO!");
            };

            ws.onerror = (err) => {
                addLog("Error en el canal WebSocket. Revisa la consola F12.");
                console.error("Detalle de error:", err);
            };

            ws.onclose = (e) => {
                addLog(`Conexión cerrada (Código: ${e.code})`);
            };
        } catch (e) {
            addLog(`Excepción crítica: ${e.message}`);
        }
    </script>
</body>
</html>
