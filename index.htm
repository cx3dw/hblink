<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tráfico Digital</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #1f2937;
            color: var(--text-muted);
            padding: 14px 18px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(56, 189, 248, 0.03);
        }

        .badge-mode {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-tg {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
        }

        .callsign {
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 0.02em;
        }

        .time {
            color: var(--text-muted);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 Tráfico DMR / YSF en Tiempo Real</h1>
            <div>
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text" style="font-size: 0.85rem; color: var(--text-muted);">Desconectado</span>
            </div>
        </header>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 12%;">Hora</th>
                        <th style="width: 12%;">Modo</th>
                        <th style="width: 30%;">Estación (Callsign - ID)</th>
                        <th style="width: 24%;">País</th>
                        <th style="width: 22%;">Destino</th>
                    </tr>
                </thead>
                <tbody id="traffic-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Esperando transmisiones en vivo...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Cambia ws:// por wss:// si tu pasarela o proxy soporta SSL, o usa ws://IP:9200
        const wsUrl = 'ws://TU_IP_DE_VPS:9200';
        let ws;

        function connect() {
            ws = new WebSocket(wsUrl);
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');

            ws.onopen = () => {
                dot.classList.add('connected');
                txt.textContent = 'Conectado en vivo';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const tbody = document.getElementById('traffic-body');

                // Si está el mensaje de espera, lo borramos
                if (tbody.querySelector('td[colspan]')) {
                    tbody.innerHTML = '';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="time">${data.time}</td>
                    <td><span class="badge-mode">${data.mode}</span></td>
                    <td class="callsign">${data.callsign}</td>
                    <td>${data.country}</td>
                    <td><span class="badge-tg">${data.destination}</span></td>
                `;

                tbody.insertBefore(tr, tbody.firstChild);

                // Límite de 30 filas máximo
                if (tbody.rows.length > 30) {
                    tbody.deleteRow(tbody.rows.length - 1);
                }
            };

            ws.onclose = () => {
                dot.classList.remove('connected');
                txt.textContent = 'Desconectado (Reconectando...)';
                setTimeout(connect, 5000);
            };
        }

        connect();
    </script>
</body>
</html>
